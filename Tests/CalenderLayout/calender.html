<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap Calendar Todo - November</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        .calendar-wrapper {
            border-radius: 12px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
        }

        .calendar-header {
            background: #f8f9fa;
            padding: 1rem;
            font-size: 1.25rem;
            font-weight: 600;
            border-bottom: 1px solid #e0e0e0;
        }

        .weekday-header {
            background: #fafafa;
            padding: 0.75rem 0;
            border-bottom: 1px solid #e0e0e0;
            font-weight: 600;
            color: #555;
        }

        .calendar-cell {
            min-height: 140px;
            border: 1px solid #f0f0f0;
            padding: 0.5rem;
            vertical-align: top;
        }

        .date-number {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.35rem;
            color: #333;
        }

        .task-card {
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 0.4rem 0.6rem;
            background: #fcfcfc;
        }

        .task-card h6 {
            font-size: 0.85rem;
            margin: 0;
            font-weight: 600;
        }

        .task-card p {
            font-size: 0.75rem;
            margin: 0;
        }
    </style>
    <link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css\" />
</head>

<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between mb-4">
            <button class="btn btn-primary">Add Task</button>
            <button class="btn btn-secondary">Settings</button>
            <div class="d-flex gap-2 align-items-center" style="width: 200px;">
                <button class="btn btn-primary w-100">Previous</button>
                <button class="btn btn-primary w-100">Next</button>
            </div>
        </div>


        <div class="calendar-wrapper">
            <div class="calendar-header text-center">November 2025</div>


            <div class="row g-0 text-center">
                <div class="col weekday-header">Sun</div>
                <div class="col weekday-header">Mon</div>
                <div class="col weekday-header">Tue</div>
                <div class="col weekday-header">Wed</div>
                <div class="col weekday-header">Thu</div>
                <div class="col weekday-header">Fri</div>
                <div class="col weekday-header">Sat</div>
            </div>


            <!-- November 2025 starts on Saturday (Nov 1 = Saturday) -->
            <div class="row g-0 text-center">
                <div class="col calendar-cell"></div>
                <div class="col calendar-cell"></div>
                <div class="col calendar-cell"></div>
                <div class="col calendar-cell"></div>
                <div class="col calendar-cell"></div>
                <div class="col calendar-cell"></div>
                <div class="col calendar-cell">
                    <div class="date-number">1</div>
                </div>
            </div>


            <div class="row g-0 text-center">
                <div class="col calendar-cell">
                    <div class="date-number">2</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">3</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">4</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">5</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">6</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">7</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">8</div>
                </div>
            </div>


            <div class="row g-0 text-center">
                <div class="col calendar-cell">
                    <div class="date-number">9</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">10</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">11</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">12</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">13</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">14</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">15</div>
                </div>
            </div>


            <div class="row g-0 text-center">
                <div class="col calendar-cell">
                    <div class="date-number">16</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">17</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">18</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">19</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">20</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">21</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">22</div>
                </div>
            </div>


            <div class="row g-0 text-center">
                <div class="col calendar-cell">
                    <div class="date-number">23</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">24</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">25</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">26</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">27</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">28</div>
                </div>
                <div class="col calendar-cell">
                    <div class="date-number">29</div>
                </div>
            </div>


            <div class="row g-0 text-center">
                <div class="col calendar-cell">
                    <div class="date-number">30</div>
                </div>
                <div class="col calendar-cell"></div>
                <div class="col calendar-cell"></div>
                <div class="col calendar-cell"></div>
                <div class="col calendar-cell"></div>
                <div class="col calendar-cell"></div>
                <div class="col calendar-cell"></div>
            </div>
        </div>
    </div>
</body>

</html>
